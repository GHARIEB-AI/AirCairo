<!--
  ==============================================================
  EXPIRED LANDING PAGE
  Written over index.html when a live snapshot's 24-hour TTL
  elapses with no newer successful run.
  The next successful publish restores gate.html over it.
  Owner rule: LATEST SUCCESSFUL RUN = the only thing Live.

  https://flyaircairo-my.sharepoint.com/personal/dammam_to_aircairo_com/_layouts/15/onedrive.aspx?id=%2Fpersonal%2Fdammam%5Fto%5Faircairo%5Fcom%2FDocuments%2Fmarket%20insights&ga=1 is substituted at install time by
  live_snapshot.install_expired_landing_page(). The page is
  never shipped with an unresolved or guessed destination.
  ==============================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png">
    <link rel="shortcut icon" href="assets/img/favicon.png">
    <link rel="apple-touch-icon" href="assets/img/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Air Cairo - Market Insights</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            width: 100%;
            max-width: 520px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(70, 43, 115, 0.16);
        }
        .header {
            background: linear-gradient(135deg, #462B73 0%, #5a3d8a 100%);
            color: #fff;
            padding: 34px 26px 30px;
            text-align: center;
        }
        .header .mark {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: #F7941D;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            line-height: 1;
        }
        .header h1 { font-size: 20px; font-weight: 700; }
        .body { padding: 28px 26px 30px; text-align: center; }
        .body p { color: #333; font-size: 15px; line-height: 1.75; margin-bottom: 22px; }
        .archive-btn {
            display: block;
            background: #F7941D;
            color: #fff;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            transition: background 0.2s, transform 0.1s;
        }
        .archive-btn:hover { background: #e0830f; }
        .archive-btn:active { transform: translateY(1px); }
        .meta {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 12px;
        }
        .meta span { display: block; margin-top: 4px; }
    </style>
</head>
<body>
    <main class="card">
        <div class="header">
            <div class="mark">&#8987;</div>
            <h1>No current live market report is available</h1>
        </div>
        <div class="body">
            <p>The latest report has expired. All previous reports are kept in the archive.</p>

            <a class="archive-btn" id="archive-link" href="https://flyaircairo-my.sharepoint.com/personal/dammam_to_aircairo_com/_layouts/15/onedrive.aspx?id=%2Fpersonal%2Fdammam%5Fto%5Faircairo%5Fcom%2FDocuments%2Fmarket%20insights&ga=1" rel="noopener">
                Open Archive
            </a>

            <div class="meta" id="snapshot-meta"></div>
        </div>
    </main>

    <script>
        // live_snapshot.json is written by the publisher and updated by the
        // expiry job. It is advisory here: the page already states the expired
        // state, and the route pages themselves are removed from the site.
        (function () {
            var meta = document.getElementById('snapshot-meta');
            fetch('live_snapshot.json', { cache: 'no-store' })
                .then(function (response) { return response.ok ? response.json() : null; })
                .then(function (snapshot) {
                    if (!snapshot) { return; }
                    var parts = [];
                    if (snapshot.run_id) { parts.push('Last run: ' + snapshot.run_id); }
                    if (snapshot.expired_at) { parts.push('Expired: ' + snapshot.expired_at); }
                    else if (snapshot.expires_at) { parts.push('Expires: ' + snapshot.expires_at); }
                    meta.innerHTML = parts.map(function (line) {
                        return '<span>' + line.replace(/[<>&]/g, '') + '</span>';
                    }).join('');
                })
                .catch(function () { /* the static message above is enough */ });
        })();
    </script>
</body>
</html>
